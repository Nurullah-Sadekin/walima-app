<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Walima — Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Poppins', sans-serif; min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; align-items: center; background: #1a1a1a; }
  .phone-frame { width: 375px; height: 812px; border-radius: 44px; overflow: hidden; position: relative; border: 6px solid #1a1a1a; box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,0.5); }
  .screen { width: 100%; height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 126px; height: 34px; background: #1a1a1a; border-radius: 0 0 20px 20px; z-index: 25; }

  .bg-photo {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
    background-size: cover; background-position: center top;
    background-repeat: no-repeat; background-color: #2a0a14;
  }
  .bg-tint {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1;
    background: rgba(80, 15, 35, 0.1);
  }
  .bg-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 58%;
    background: linear-gradient(to top, rgba(10,2,5,0.97) 0%, rgba(10,2,5,0.88) 30%, rgba(10,2,5,0.5) 60%, transparent 100%);
    z-index: 2;
  }

  .status-bar { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 12px 28px 0; flex-shrink: 0; position: relative; z-index: 20; }
  .status-time { font-size: 15px; font-weight: 600; color: white; }
  .status-icons { display: flex; align-items: center; gap: 5px; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 24px 0; position: relative; z-index: 20; }
  .lang-btn { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15); border: none; border-radius: 50px; padding: 7px 14px; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 12.5px; font-weight: 500; color: white; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .help-btn { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.15); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .help-btn:active { background: rgba(255,255,255,0.25); }

  .logo-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10; margin-top: -40px; }
  .brand-name { font-family: 'Playfair Display', serif; font-size: 58px; font-weight: 700; color: white; letter-spacing: -1px; line-height: 1; text-align: center; text-shadow: 0 4px 30px rgba(0,0,0,0.4); }
  .brand-name .w-letter { font-style: italic; }
  .logo-accent { display: inline-block; position: relative; top: -23px; left: -2px; }
  .tagline { margin-top: 8px; font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,0.75); letter-spacing: 3.5px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }

  .cta-area { position: relative; z-index: 20; padding: 0 24px 38px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .login-btn { width: 100%; height: 54px; border-radius: 50px; border: none; background: white; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 14.5px; font-weight: 600; color: #1a1a1a; letter-spacing: 0.1px; transition: transform 0.1s; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
  .login-btn:active { transform: scale(0.97); }
  .login-btn.otp-btn { background: #E8447A; color: white; box-shadow: 0 4px 20px rgba(232,68,122,0.4); }
  .terms-text { margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 300; text-align: center; }
  .terms-text a { color: rgba(255,255,255,0.65); text-decoration: underline; }

  .modal-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 50; align-items: center; justify-content: center; padding: 30px; }
  .modal-overlay.show { display: flex; }
  .modal-card { background: white; border-radius: 20px; padding: 28px 24px 22px; width: 100%; max-width: 320px; text-align: center; }
  .modal-title { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
  .modal-sub { font-size: 13px; color: #888; font-weight: 300; line-height: 1.5; margin-bottom: 20px; }
  .modal-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid #F2F2F2; cursor: pointer; text-align: left; }
  .modal-icon { width: 36px; height: 36px; border-radius: 50%; background: rgba(232,68,122,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .modal-item-text { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .modal-cancel { margin-top: 10px; font-size: 14px; font-weight: 600; color: #E8447A; background: none; border: none; cursor: pointer; padding: 8px 20px; font-family: 'Poppins', sans-serif; }

  .g-blue { fill: #4285F4; } .g-red { fill: #EA4335; } .g-yellow { fill: #FBBC05; } .g-green { fill: #34A853; }

  .home-indicator { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; z-index: 20; }

  @media (max-width: 420px) {
    body { background: #1a1a1a; align-items: stretch; }
    .phone-frame { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
    .notch { display: none; } .status-bar { padding-top: 8px; }
  }
</style>
</head>

  <div class="screen">
    <div class="notch"></div>

    <div class="bg-photo" id="bgPhoto"></div>

    <div class="status-bar">

    </div>

    <div class="home-indicator"></div>
  </div>
</div>
