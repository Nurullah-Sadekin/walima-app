name: walima_llc
description: Walima is a halal Muslim matrimonial app for adults (18+) seeking marriage. Not a dating app a serious, family-friendly matchmaking platform for the global Muslim ummah.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Routing
  go_router: ^13.0.0
  
  # Network
  dio: ^5.4.0
  socket_io_client: ^2.0.0
  pretty_dio_logger: ^1.3.1
  flutter_svg: ^2.2.4
  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  shimmer: ^3.0.0
  image_picker: ^1.2.1
  image_cropper: ^8.1.0
  webview_flutter: ^4.13.1
  flutter_inappwebview: ^6.1.5
  permission_handler: ^11.3.1
  carousel_slider: ^5.1.2
  country_picker: ^2.0.27
  connectivity_plus: ^4.0.0
  internet_connection_checker: ^1.0.0+1
  flutter_local_notifications: ^17.2.2
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_crashlytics: ^4.3.10
  firebase_messaging: ^15.1.6
  device_info_plus: ^11.2.1
  package_info_plus: ^8.1.2
  uuid: ^4.5.1
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  pdf: ^3.11.3
  printing: ^5.14.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.3
  dotted_border: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  generate: true
  
  assets:
     - assets/images/
     - assets/icons/
     - assets/svgs/
     - assets/svgIcons/
     - assets/nav_icons/
     - assets/biodata/
     - assets/biodata/thumbnails/
     - assets/biodata/mainBioData/
     - assets/biodata/designOne/
     - assets/biodata/designTwo/
     - assets/biodata/designThree/
     - assets/biodata/designFour/
     - assets/biodata/designFive/
     - assets/biodata/designSix/
     - assets/biodata/designSeven/
     - assets/biodata/designEight/
     - assets/biodata/designEleven/
     - assets/sounds/chat_sound.mp3
     - lib/features/registration/domain/json/religion_name_options.json
     - lib/features/registration/domain/json/residency_status_options.json
