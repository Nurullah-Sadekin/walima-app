name: flutter_boilerplate
description: A Flutter boilerplate with clean architecture, GoRouter, Riverpod, and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Routing
  go_router: ^13.0.0
  
  # Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  flutter_svg: ^2.2.4
  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  shimmer: ^3.0.0
  image_picker: ^1.2.1
  image_cropper: ^8.1.0
  carousel_slider: ^5.1.2
  country_picker: ^2.0.27

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  generate: true
  
  assets:
     - assets/images/
     - assets/icons/
     - assets/svgs/
     - assets/svgIcons/
     - assets/nav_icons/
     - lib/features/registration/domain/json/religion_name_options.json
     - lib/features/registration/domain/json/residency_status_options.json
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700
